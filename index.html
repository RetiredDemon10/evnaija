    <style>
      /* Boot splash: painted before any JS/CSS bundle arrives so the first
         frame is on-brand instead of a white screen. Removed on app mount. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #041217;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-splash[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .boot-splash__mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-splash__word {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #ffffff;
      }
      .boot-splash__word span {
        color: #c6f36a;
      }
      .boot-splash__bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      .boot-splash__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #c6f36a;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.85; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark, .boot-splash__bar::after { animation: none; }
      }
    </style>
