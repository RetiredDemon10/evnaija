  </g>
  <text x="228" y="208" font-family="Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-2.5">EV <tspan fill="#C6F36A">Naija</tspan></text>

  <text x="96" y="368" font-family="Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Power your journey.</text>
  <text x="96" y="436" font-family="Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#C6F36A" letter-spacing="-1.5">Charge without limits.</text>
  <text x="96" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#829194">Verified EV charging across Lagos, Abuja &amp; Port Harcourt</text>

  <rect x="96" y="536" width="520" height="58" rx="29" fill="#C6F36A" />
  <text x="356" y="573" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#071B22">Nigeria&#8217;s EV charging marketplace</text>
