<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EV Naija — Power your journey. Charge without limits.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041217" />
      <stop offset="1" stop-color="#071B22" />
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#C6F36A" stop-opacity="0.30" />
      <stop offset="1" stop-color="#C6F36A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#C6F36A" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
