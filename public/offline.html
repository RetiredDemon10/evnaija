<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071B22" />
    <title>Offline — EV Naija</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 0%, #123b36 0%, #071b22 48%, #051216 100%);
        color: #f4fbf6;
      }
      main {
        width: min(560px, 100%);
        border: 1px solid rgba(183, 224, 74, 0.22);
        border-radius: 28px;
        background: rgba(7, 27, 34, 0.82);
        padding: clamp(28px, 6vw, 52px);
        box-shadow: 0 30px 90px -30px rgba(0, 0, 0, 0.8);
      }
      img { width: min(220px, 70%); height: auto; display: block; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 34px;
        border: 1px solid rgba(183, 224, 74, 0.35);
        border-radius: 999px;
        padding: 7px 12px;
        color: #cbe88a;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 0;
        font-size: clamp(30px, 7vw, 46px);
        line-height: 1.02;
        letter-spacing: -0.045em;
        font-weight: 700;
      }
      p {
        margin: 16px 0 0;
        color: #a8b8b0;
        font-size: 14px;
        line-height: 1.75;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      button, a {
        border: 0;
        border-radius: 12px;
        padding: 13px 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: #b7e04a; color: #071b22; }
      a { border: 1px solid rgba(255, 255, 255, 0.16); color: #f4fbf6; }
      .hint { margin-top: 24px; font-size: 11px; color: #6f837c; }
    </style>
  </head>
  <body>
    <main>
      <img src="/ev-naija-logo.png" alt="EV Naija" />
      <span class="pill">Offline mode</span>
      <h1>You are off the grid.</h1>
      <p>
        The connection dropped, but your saved app screens may still be available. Reconnect to find chargers,
        load live availability or complete a payment.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/app/bookings">Open my bookings</a>
      </div>
      <p class="hint">EV Naija never marks a payment successful while offline.</p>
    </main>
  </body>
</html>
